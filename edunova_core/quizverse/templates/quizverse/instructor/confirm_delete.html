{% extends 'global/base.html' %}
{% block title %}Delete Quiz | EduNova{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="card border-danger shadow p-4">
    <h3 class="text-danger mb-3">⚠️ Confirm Delete</h3>
    <p>Are you sure you want to delete the quiz "<strong>{{ quiz.title }}</strong>"?</p>
    <form method="POST">
      {% csrf_token %}
      <div class="d-flex justify-content-between mt-3">
        <a href="{% url 'instructor_dashboard' %}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-danger">🗑️ Delete</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
