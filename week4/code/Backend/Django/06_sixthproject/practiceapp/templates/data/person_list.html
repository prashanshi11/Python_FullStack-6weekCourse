<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adding person_list</title>
</head>
<body>
  <!-- templates/data/person_list.html -->
<h1>Person List</h1>
<ul>
  {% for person in people %}
    <li>{{ person.name }} - {{ person.age }}</li>
  {% empty %}
    <li>No people found</li>
  {% endfor %}  
</ul>
  <a href="{% url 'add_person' %}">Add Person</a>
 

</body>
</html>
